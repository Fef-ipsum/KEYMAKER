<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#e9ecf0" />
    <meta name="description" content="Keymaker — apprendre Strudel et le solfège" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <title>Keymaker</title>
    <link rel="icon" href="/icons/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icons/pwa-192.png" />
    <link rel="preload" href="/fonts/jakarta-var.woff2" as="font" type="font/woff2" crossorigin />
    <style>
      /* Avant le chargement de la feuille de style : le bon fond, clair ou sombre, sans flash. */
      html, body { margin: 0; background: #e6e9ee; }
      @media (prefers-color-scheme: dark) { html:not([data-theme='light']), html:not([data-theme='light']) body { background: #090b10; } }
      html[data-theme='dark'], html[data-theme='dark'] body { background: #090b10; }
    </style>
    <script>
      // Thème choisi dans les réglages, appliqué avant le premier affichage.
      try {
        var s = JSON.parse(localStorage.getItem('km2:settings') || '{}');
        if (s.theme === 'light' || s.theme === 'dark') document.documentElement.setAttribute('data-theme', s.theme);
      } catch (e) {}
    </script>
    <!-- Moteur Strudel vendorisé (@strudel/repl 1.3.0), chargé localement : aucune dépendance
         à un serveur tiers pour le code. Il définit le composant <strudel-editor>. -->
    <script src="/vendor/strudel-repl/index.js" defer></script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>Keymaker a besoin de JavaScript pour fonctionner.</noscript>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
