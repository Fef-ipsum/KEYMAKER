    <!-- Chantier 46 : tap audio pour l'oscilloscope du Studio. On capture le
         PREMIER AudioContext créé (celui de superdough) et on duplique vers un
         AnalyserNode toute connexion vers la destination — copie du signal,
         jamais sur le chemin du son. 100% best-effort. -->
    <script>
      (function () {
        try {
          var Native = window.AudioContext || window.webkitAudioContext;
          if (!Native) return;
          var Captured = function () {
            var ctx = Reflect.construct(Native, arguments, Captured);
            if (!window.__keymakerAudioCtx) window.__keymakerAudioCtx = ctx;
            return ctx;
          };
          Captured.prototype = Native.prototype;
          Object.setPrototypeOf(Captured, Native);
          window.AudioContext = Captured;
          if (window.webkitAudioContext) window.webkitAudioContext = Captured;
          var origConnect = AudioNode.prototype.connect;
          AudioNode.prototype.connect = function (target) {
            try {
              if (
                target && this.context && this.context === window.__keymakerAudioCtx &&
                target === this.context.destination
              ) {
                if (!window.__keymakerTap) {
                  window.__keymakerTap = this.context.createAnalyser();
                  window.__keymakerTap.fftSize = 2048;
                }
                origConnect.call(this, window.__keymakerTap);
              }
            } catch (e) { /* le tap ne doit jamais casser le son */ }
            return origConnect.apply(this, arguments);
          };
        } catch (e) { /* idem */ }
      })();
    </script>
