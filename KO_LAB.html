<!DOCTYPE html>
<html lang="fr" data-theme="void">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>KO LAB — apprendre le PO-33 K.O!</title>
<meta name="description" content="Apprendre le sampler Teenage Engineering PO-33 K.O! — leçons, simulateur jouable, révision espacée.">
<style>
/* ============================================================
   KO LAB — trainer pour le Teenage Engineering PO-33 K.O!
   Sœur de Keymaker. Thème Void par défaut (amber + LCD phosphore).
   100% autonome, hors-ligne, zéro dépendance.
   ============================================================ */

:root, [data-theme="void"]{
  --bg:        #0b0e17;
  --bg-2:      #0f1320;
  --surface:   rgba(255,255,255,0.035);
  --surface-2: rgba(255,255,255,0.06);
  --panel:     #141a28;
  --border:    rgba(var(--accent-rgb), 0.20);
  --border-soft: rgba(255,255,255,0.08);
  --accent:    #f0b429;          /* amber KO */
  --accent-rgb: 240, 180, 41;
  --accent-2:  #34d1c4;          /* cyan secondaire (liens) */
  --accent-ink:#1a1402;
  --text:      #e7eef6;
  --muted:     #93a6bd;
  --danger:    #fb7185;
  --good:      #4ade80;
  --bg-fade:   rgba(11,14,23,0.82);
  /* device */
  --pcb:       #0a0c13;
  --pcb-2:     #11141f;
  --silk:      #d6deea;
  --key:       #1a2030;
  --key-face:  #222a3d;
  --lcd-bg:    #0b1410;
  --lcd-on:    #7dff9b;          /* phosphore vert */
  --lcd-dim:   rgba(125,255,155,0.12);
  --radius:    16px;
  --ease:      cubic-bezier(0.32, 0.72, 0, 1);
  --glow:      0 0 0 1px var(--border), 0 18px 50px -22px rgba(var(--accent-rgb), 0.45);
  --font-ui:   ui-sans-serif, system-ui, 'Segoe UI', 'Helvetica Neue', sans-serif;
  --font-mono: 'JetBrains Mono', ui-monospace, 'Cascadia Code', 'SF Mono', Consolas, monospace;
  --fs-body:   17px;
  --fs-title:  clamp(28px, 4.2vw, 42px);
}

[data-theme="light"]{
  --bg:#f3f5fb; --bg-2:#ffffff; --surface:rgba(20,24,48,0.05); --surface-2:rgba(20,24,48,0.09);
  --panel:#ffffff; --border:rgba(193,135,18,0.34); --border-soft:rgba(20,24,48,0.12);
  --accent:#b8770e; --accent-rgb:184,119,14; --accent-2:#0f9b8e; --accent-ink:#fff;
  --text:#1a2030; --muted:#586074; --danger:#d92d54; --good:#1f9d57; --bg-fade:rgba(243,245,251,0.85);
  --pcb:#11141f; --pcb-2:#1a1f2e; --silk:#e6ebf4; --key:#222a3d; --key-face:#2b3450;
  --lcd-bg:#0b1410; --lcd-on:#7dff9b; --lcd-dim:rgba(125,255,155,0.12);
}

[data-theme="matrix"]{
  --bg:#04080a; --bg-2:#081410; --surface:rgba(0,255,140,0.045); --surface-2:rgba(0,255,140,0.09);
  --panel:#07140f; --border:rgba(0,255,140,0.28); --border-soft:rgba(120,255,180,0.12);
  --accent:#26ff9c; --accent-rgb:38,255,156; --accent-2:#22d3ee; --accent-ink:#021a0e;
  --text:#c8ffdd; --muted:#5fae84; --danger:#ff5d6c; --good:#26ff9c; --bg-fade:rgba(4,8,10,0.86);
  --pcb:#03100a; --pcb-2:#06170f; --silk:#bdf5d2; --key:#0a1f16; --key-face:#0e2a1d;
  --lcd-bg:#03120a; --lcd-on:#5dffa0; --lcd-dim:rgba(93,255,160,0.12);
}

*{ box-sizing:border-box; }
html,body{ height:100%; }
body{
  margin:0; color:var(--text); font-family:var(--font-ui);
  font-size:calc(var(--fs-body) * var(--fs-scale, 1)); line-height:1.6;
  background:
    radial-gradient(1100px 620px at 78% -12%, rgba(var(--accent-rgb),0.12), transparent 60%),
    radial-gradient(900px 520px at -5% 108%, rgba(52,209,196,0.08), transparent 55%),
    var(--bg);
  background-attachment:fixed; -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility;
}
::selection{ background:rgba(var(--accent-rgb),0.30); }
a{ color:var(--accent-2); text-decoration:none; }
button{ font-family:inherit; }

/* ---------- Topbar ---------- */
.topbar{
  display:flex; align-items:center; justify-content:space-between; gap:16px; flex-wrap:wrap;
  padding:14px clamp(14px,4vw,40px); border-bottom:1px solid var(--border-soft);
  position:sticky; top:0; z-index:20; background:linear-gradient(var(--bg), var(--bg-fade));
  backdrop-filter:blur(10px);
}
.brand{ display:flex; align-items:center; gap:12px; cursor:pointer; user-select:none; }
.brand .mark{
  width:38px; height:38px; border-radius:11px; display:grid; place-items:center;
  background:var(--pcb); border:1px solid var(--border-soft);
  box-shadow:inset 0 1px 1px rgba(255,255,255,0.08), 0 6px 18px -10px rgba(var(--accent-rgb),0.6);
  font-family:var(--font-mono); font-weight:800; font-size:13px; color:var(--accent);
  letter-spacing:-0.5px; position:relative;
}
.brand .mark::after{ content:""; position:absolute; inset:0; border-radius:inherit; box-shadow:0 0 0 3px rgba(var(--accent-rgb),0.0); }
.brand .name{ font-weight:800; font-size:19px; letter-spacing:0.2px; }
.brand .name b{ color:var(--accent); }
.brand .sub{ display:block; font-family:var(--font-mono); font-size:10.5px; letter-spacing:2px;
  text-transform:uppercase; color:var(--muted); margin-top:-2px; }

.nav{ display:flex; gap:4px; align-items:center; flex-wrap:wrap; }
.nav button{
  appearance:none; border:1px solid transparent; background:transparent; color:var(--muted);
  padding:8px 13px; border-radius:11px; font-size:13.5px; font-weight:600; cursor:pointer;
  transition:all .35s var(--ease); display:inline-flex; align-items:center; gap:7px; min-height:40px;
}
.nav button .ic{ width:16px; height:16px; opacity:.85; }
.nav button:hover{ color:var(--text); background:var(--surface); }
.nav button.active{ color:var(--accent-ink); background:var(--accent); border-color:var(--accent);
  box-shadow:0 6px 18px -8px rgba(var(--accent-rgb),0.7); }
.nav button.active .ic{ opacity:1; }
.iconbtn{
  appearance:none; width:40px; height:40px; border-radius:11px; border:1px solid var(--border-soft);
  background:var(--surface); color:var(--text); cursor:pointer; display:grid; place-items:center;
  transition:all .35s var(--ease);
}
.iconbtn:hover{ background:var(--surface-2); transform:translateY(-1px); }

/* ---------- Stage ---------- */
.stage{ width:min(1080px, 100%); margin:0 auto; padding:clamp(20px,4vw,44px) clamp(14px,4vw,40px) 120px; }
.eyebrow{
  display:inline-flex; align-items:center; gap:8px; font-family:var(--font-mono);
  font-size:10.5px; letter-spacing:2.5px; text-transform:uppercase; color:var(--accent);
  background:rgba(var(--accent-rgb),0.10); border:1px solid var(--border);
  padding:5px 11px; border-radius:999px; margin-bottom:14px;
}
.eyebrow.tone-muted{ color:var(--muted); background:var(--surface); border-color:var(--border-soft); }
h1.title{ font-size:var(--fs-title); line-height:1.08; letter-spacing:-0.02em; margin:0 0 12px; font-weight:800; }
.lede{ color:var(--muted); font-size:18px; max-width:62ch; margin:0 0 26px; }
.section-head{ display:flex; align-items:baseline; justify-content:space-between; gap:14px; margin:38px 0 16px; flex-wrap:wrap; }
.section-head h2{ font-size:21px; margin:0; letter-spacing:-0.01em; }
.section-head .hint{ font-family:var(--font-mono); font-size:12px; color:var(--muted); }

/* ---------- Double-bezel card ---------- */
.tray{ background:var(--surface); border:1px solid var(--border-soft); border-radius:calc(var(--radius) + 6px);
  padding:6px; transition:transform .5s var(--ease), box-shadow .5s var(--ease); }
.card{ background:var(--panel); border-radius:var(--radius); border:1px solid var(--border-soft);
  box-shadow:inset 0 1px 1px rgba(255,255,255,0.05); padding:20px; }
.tray:hover{ box-shadow:var(--glow); }

/* reveal-on-scroll */
.reveal{ opacity:0; transform:translateY(22px); filter:blur(6px); }
.reveal.in{ opacity:1; transform:none; filter:none; transition:opacity .8s var(--ease), transform .8s var(--ease), filter .8s var(--ease); }
@media (prefers-reduced-motion: reduce){ .reveal{ opacity:1; transform:none; filter:none; } }

/* ---------- Buttons ---------- */
.btn{
  appearance:none; cursor:pointer; border:1px solid var(--border-soft); background:var(--surface-2);
  color:var(--text); font-weight:700; font-size:14.5px; padding:12px 18px; border-radius:999px;
  display:inline-flex; align-items:center; gap:10px; transition:all .4s var(--ease); min-height:46px;
}
.btn:hover{ transform:translateY(-1px); background:var(--surface); }
.btn:active{ transform:scale(.98); }
.btn .pill{ width:30px; height:30px; border-radius:999px; display:grid; place-items:center;
  background:rgba(255,255,255,0.08); transition:transform .4s var(--ease); }
.btn:hover .pill{ transform:translate(2px,-1px) scale(1.05); }
.btn.primary{ background:var(--accent); color:var(--accent-ink); border-color:var(--accent);
  box-shadow:0 10px 28px -12px rgba(var(--accent-rgb),0.85); }
.btn.primary .pill{ background:rgba(0,0,0,0.18); }
.btn.ghost{ background:transparent; }
.btn.sm{ padding:8px 13px; min-height:38px; font-size:13px; }
.btn:disabled{ opacity:.4; cursor:not-allowed; }

.chip{ display:inline-flex; align-items:center; gap:6px; font-family:var(--font-mono); font-size:11.5px;
  padding:4px 9px; border-radius:8px; background:var(--surface); border:1px solid var(--border-soft); color:var(--muted); }
.chip.live{ color:var(--accent); border-color:var(--border); background:rgba(var(--accent-rgb),0.08); }

/* combo notation */
.combo{ display:inline-flex; flex-wrap:wrap; gap:6px; align-items:center; font-family:var(--font-mono); font-size:13px; }
.kbd{ display:inline-grid; place-items:center; min-width:30px; height:30px; padding:0 9px; border-radius:8px;
  background:var(--key-face); color:var(--silk); border:1px solid rgba(255,255,255,0.10);
  box-shadow:0 2px 0 rgba(0,0,0,0.4), inset 0 1px 0 rgba(255,255,255,0.10); font-weight:700; font-size:12px; letter-spacing:.3px; }
.kbd.accent{ background:var(--accent); color:var(--accent-ink); border-color:var(--accent); }
.combo .plus{ color:var(--muted); font-weight:700; }

/* ============================================================
   HOME / DASHBOARD
   ============================================================ */
.hero{ display:grid; grid-template-columns:1.15fr 1fr; gap:26px; align-items:center; }
@media (max-width:860px){ .hero{ grid-template-columns:1fr; } }
.stat-row{ display:grid; grid-template-columns:repeat(4,1fr); gap:12px; margin:8px 0 6px; }
@media (max-width:680px){ .stat-row{ grid-template-columns:repeat(2,1fr); } }
.stat{ padding:14px 16px; }
.stat .n{ font-size:26px; font-weight:800; line-height:1; letter-spacing:-0.02em; }
.stat .l{ font-family:var(--font-mono); font-size:10.5px; letter-spacing:1.5px; text-transform:uppercase; color:var(--muted); margin-top:7px; }
.stat .n.accent{ color:var(--accent); }

.modgrid{ display:grid; grid-template-columns:repeat(auto-fill, minmax(250px,1fr)); gap:14px; }
.modcard{ cursor:pointer; position:relative; overflow:hidden; }
.modcard .topline{ display:flex; align-items:center; justify-content:space-between; gap:10px; margin-bottom:12px; }
.modcard .mnum{ font-family:var(--font-mono); font-size:11px; color:var(--muted); letter-spacing:1px; }
.modcard h3{ margin:0 0 6px; font-size:17px; letter-spacing:-0.01em; }
.modcard p{ margin:0; color:var(--muted); font-size:13.5px; }
.modcard .mtint{ position:absolute; inset:0 auto 0 0; width:4px; background:var(--mtint, var(--accent)); }
.modcard.done .badge-done{ color:var(--good); }
.dots{ display:flex; gap:4px; margin-top:14px; flex-wrap:wrap; }
.dots i{ width:9px; height:9px; border-radius:3px; background:var(--surface-2); border:1px solid var(--border-soft); display:block; }
.dots i.on{ background:var(--mtint, var(--accent)); border-color:transparent; }
.bar{ height:7px; border-radius:99px; background:var(--surface-2); overflow:hidden; margin-top:14px; }
.bar > i{ display:block; height:100%; background:linear-gradient(90deg, var(--mtint,var(--accent)), var(--accent)); border-radius:99px; transition:width .8s var(--ease); }

/* ============================================================
   LESSON VIEW
   ============================================================ */
.lesson-wrap{ display:grid; grid-template-columns:1fr 0.92fr; gap:24px; align-items:start; }
@media (max-width:980px){ .lesson-wrap{ grid-template-columns:1fr; } }
.lesson-body h2{ font-size:24px; letter-spacing:-0.01em; margin:0 0 6px; }
.lesson-goal{ color:var(--accent); font-weight:600; margin:0 0 18px; font-size:15.5px; }
.prose p{ margin:0 0 14px; }
.prose strong{ color:var(--text); }
.note{ border-left:3px solid var(--accent); background:rgba(var(--accent-rgb),0.06); padding:13px 16px;
  border-radius:0 12px 12px 0; margin:18px 0; font-size:15px; }
.note .lab{ font-family:var(--font-mono); font-size:10.5px; letter-spacing:2px; text-transform:uppercase; color:var(--accent); display:block; margin-bottom:5px; }
.steps{ counter-reset:s; list-style:none; padding:0; margin:18px 0; display:grid; gap:10px; }
.steps li{ counter-increment:s; position:relative; padding:13px 16px 13px 52px; background:var(--surface); border:1px solid var(--border-soft); border-radius:12px; font-size:15px; }
.steps li::before{ content:counter(s); position:absolute; left:12px; top:11px; width:28px; height:28px; border-radius:8px;
  background:var(--accent); color:var(--accent-ink); display:grid; place-items:center; font-family:var(--font-mono); font-weight:800; font-size:13px; }
.combo-box{ margin:18px 0; padding:16px; border-radius:14px; background:var(--pcb); border:1px solid var(--border-soft); }
.combo-box .lab{ font-family:var(--font-mono); font-size:10.5px; letter-spacing:2px; text-transform:uppercase; color:var(--muted); margin-bottom:10px; }
.combo-box .cap{ color:var(--muted); font-size:13.5px; margin-top:10px; }

.flash{ margin-top:22px; }
.flash .q{ font-weight:700; font-size:16px; margin-bottom:10px; }
.flash .a{ color:var(--muted); font-size:15px; display:none; }
.flash.open .a{ display:block; animation:fade .4s var(--ease); }
@keyframes fade{ from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:none;} }

.lesson-foot{ display:flex; align-items:center; justify-content:space-between; gap:12px; margin-top:30px; flex-wrap:wrap; }
.crumbtrail{ font-family:var(--font-mono); font-size:12px; color:var(--muted); }

/* lesson sidebar list */
.lessonlist{ position:sticky; top:78px; }
.lessonlist .li{ display:flex; align-items:center; gap:11px; padding:10px 12px; border-radius:11px; cursor:pointer;
  transition:background .3s var(--ease); font-size:14px; }
.lessonlist .li:hover{ background:var(--surface); }
.lessonlist .li.active{ background:var(--surface-2); }
.lessonlist .li .tick{ width:20px; height:20px; border-radius:6px; border:1px solid var(--border-soft); display:grid; place-items:center; flex:0 0 auto; font-size:11px; color:var(--muted); }
.lessonlist .li.seen .tick{ background:var(--good); border-color:transparent; color:#04140a; }
.lessonlist .li.master .tick{ background:var(--accent); border-color:transparent; color:var(--accent-ink); }

/* ============================================================
   DEVICE SIMULATOR
   ============================================================ */
.po{ --u: clamp(15px, 3.4vw, 22px); width:100%; max-width:560px; margin:0 auto; }
.po-shell{ background:linear-gradient(160deg, var(--pcb-2), var(--pcb)); border-radius:22px; padding:calc(var(--u)*0.9);
  border:1px solid rgba(255,255,255,0.06); box-shadow:0 30px 80px -40px rgba(0,0,0,0.9), inset 0 1px 0 rgba(255,255,255,0.06); position:relative; }
.po-top{ display:flex; gap:calc(var(--u)*0.8); align-items:stretch; margin-bottom:calc(var(--u)*0.8); }
.lcd{ flex:1; background:var(--lcd-bg); border-radius:12px; padding:12px 14px; position:relative; overflow:hidden;
  border:1px solid rgba(125,255,155,0.10); box-shadow:inset 0 2px 14px rgba(0,0,0,0.7); min-height:118px;
  display:flex; flex-direction:column; justify-content:space-between; }
.lcd::before{ content:""; position:absolute; inset:0; background:repeating-linear-gradient(0deg, rgba(0,0,0,0.18) 0 1px, transparent 1px 3px); pointer-events:none; opacity:.5; }
.lcd .row1{ display:flex; justify-content:space-between; align-items:flex-start; font-family:var(--font-mono); color:var(--lcd-on); }
.lcd .mode{ font-size:13px; letter-spacing:2px; text-shadow:0 0 8px rgba(125,255,155,0.5); }
.lcd .bpm{ font-size:13px; text-shadow:0 0 8px rgba(125,255,155,0.5); }
.lcd .big{ font-family:var(--font-mono); font-size:34px; font-weight:700; color:var(--lcd-on); letter-spacing:1px; text-shadow:0 0 14px rgba(125,255,155,0.45); line-height:1; }
.lcd .msg{ font-family:var(--font-mono); font-size:11px; color:var(--lcd-on); opacity:.85; min-height:14px; }
.lcd .wr{ font-family:var(--font-mono); font-size:10px; color:var(--lcd-on); border:1px solid rgba(125,255,155,0.4); border-radius:4px; padding:1px 5px; opacity:.25; }
.lcd .wr.on{ opacity:1; background:rgba(125,255,155,0.16); animation:wrb 1s steps(2) infinite; }
@keyframes wrb{ 50%{ opacity:.4; } }
/* mini step viz on lcd */
.lcd-steps{ display:grid; grid-template-columns:repeat(16,1fr); gap:2px; margin-top:6px; }
.lcd-steps i{ height:7px; border-radius:1px; background:var(--lcd-dim); }
.lcd-steps i.on{ background:rgba(125,255,155,0.55); }
.lcd-steps i.head{ background:var(--lcd-on); box-shadow:0 0 6px rgba(125,255,155,0.8); }

.knobs{ display:flex; flex-direction:column; justify-content:space-between; gap:calc(var(--u)*0.5); width:calc(var(--u)*2.6); }
.knob{ flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:5px; }
.knob .dial{ width:calc(var(--u)*2.1); height:calc(var(--u)*2.1); border-radius:50%; background:radial-gradient(circle at 38% 32%, #2a3247, #11151f);
  border:1px solid rgba(255,255,255,0.10); box-shadow:0 6px 14px -6px rgba(0,0,0,0.8), inset 0 1px 1px rgba(255,255,255,0.12); position:relative; cursor:grab; }
.knob .dial::after{ content:""; position:absolute; left:50%; top:7%; width:2px; height:34%; background:var(--accent); border-radius:2px; transform-origin:bottom center; transform:translateX(-50%) rotate(var(--rot,0deg)); box-shadow:0 0 6px rgba(var(--accent-rgb),0.7); }
.knob .lab{ font-family:var(--font-mono); font-size:10px; letter-spacing:1px; color:var(--silk); opacity:.7; }

/* function buttons */
.fnrow{ display:grid; grid-template-columns:repeat(4,1fr); gap:calc(var(--u)*0.55); margin-bottom:calc(var(--u)*0.7); }
.fnbtn{ appearance:none; cursor:pointer; border:none; border-radius:10px; padding:10px 6px 8px; min-height:50px;
  background:linear-gradient(180deg, var(--key-face), var(--key)); color:var(--silk);
  box-shadow:0 3px 0 rgba(0,0,0,0.45), inset 0 1px 0 rgba(255,255,255,0.08); transition:transform .08s ease, box-shadow .08s ease, background .2s ease;
  display:flex; flex-direction:column; align-items:center; gap:3px; position:relative; }
.fnbtn .nm{ font-family:var(--font-mono); font-size:11px; font-weight:700; letter-spacing:.5px; }
.fnbtn .sub{ font-family:var(--font-mono); font-size:8.5px; letter-spacing:.5px; opacity:.5; }
.fnbtn:active, .fnbtn.press{ transform:translateY(2px); box-shadow:0 1px 0 rgba(0,0,0,0.45), inset 0 1px 0 rgba(255,255,255,0.06); }
.fnbtn.held{ background:linear-gradient(180deg, rgba(var(--accent-rgb),0.9), rgba(var(--accent-rgb),0.65)); color:var(--accent-ink); }
.fnbtn.toggled{ outline:2px solid var(--accent); outline-offset:1px; }
.fnbtn.hl{ animation:hlpulse 1.1s var(--ease) infinite; }
@keyframes hlpulse{ 0%,100%{ box-shadow:0 3px 0 rgba(0,0,0,0.45), 0 0 0 0 rgba(var(--accent-rgb),0.0);} 50%{ box-shadow:0 3px 0 rgba(0,0,0,0.45), 0 0 0 6px rgba(var(--accent-rgb),0.35);} }
.fnbtn.play.on .nm{ color:var(--good); }

/* 16 key grid (2 rows of 8) */
.keys{ display:grid; grid-template-columns:repeat(8,1fr); gap:calc(var(--u)*0.5); }
.key{ appearance:none; cursor:pointer; aspect-ratio:1/1; border:none; border-radius:12px; position:relative;
  background:linear-gradient(180deg, var(--key-face), var(--key)); color:var(--silk);
  box-shadow:0 4px 0 rgba(0,0,0,0.45), inset 0 1px 0 rgba(255,255,255,0.07); transition:transform .07s ease, box-shadow .12s ease, background .15s ease;
  display:grid; place-items:center; font-family:var(--font-mono); font-weight:700; font-size:14px; }
.key .kn{ opacity:.65; }
.key .dot{ position:absolute; top:6px; right:7px; width:7px; height:7px; border-radius:50%; background:transparent; }
.key.step-on{ background:linear-gradient(180deg, #2f3a54, #232c41); }
.key.step-on .dot{ background:var(--accent); box-shadow:0 0 8px rgba(var(--accent-rgb),0.8); }
.key.head{ box-shadow:0 4px 0 rgba(0,0,0,0.45), 0 0 0 2px var(--lcd-on); }
.key.head .kn{ color:var(--lcd-on); opacity:1; }
.key:active, .key.press{ transform:translateY(3px); box-shadow:0 1px 0 rgba(0,0,0,0.45), inset 0 1px 0 rgba(255,255,255,0.05); }
.key.lit{ background:linear-gradient(180deg, rgba(var(--accent-rgb),0.85), rgba(var(--accent-rgb),0.55)); color:var(--accent-ink); }
.key.hl{ animation:keyhl 1.1s var(--ease) infinite; }
@keyframes keyhl{ 0%,100%{ box-shadow:0 4px 0 rgba(0,0,0,0.45), 0 0 0 0 rgba(var(--accent-rgb),0); } 50%{ box-shadow:0 4px 0 rgba(0,0,0,0.45), 0 0 0 5px rgba(var(--accent-rgb),0.4); } }
.key .slabel{ position:absolute; bottom:5px; left:0; right:0; text-align:center; font-size:7.5px; letter-spacing:.3px; opacity:.45; text-transform:uppercase; }

/* simulator surrounding UI */
.sim-toolbar{ display:flex; flex-wrap:wrap; gap:8px; align-items:center; justify-content:center; margin-bottom:18px; }
.seg{ display:inline-flex; background:var(--surface); border:1px solid var(--border-soft); border-radius:11px; padding:3px; gap:3px; }
.seg button{ appearance:none; border:none; background:transparent; color:var(--muted); font-weight:700; font-size:13px;
  padding:8px 14px; border-radius:8px; cursor:pointer; transition:all .3s var(--ease); }
.seg button.on{ background:var(--accent); color:var(--accent-ink); }
.sim-hint{ text-align:center; color:var(--muted); font-size:13.5px; margin:16px auto 0; max-width:54ch; min-height:20px; }
.sim-hint b{ color:var(--text); }
.coach{ max-width:560px; margin:16px auto 0; }
.coach .card{ display:flex; gap:14px; align-items:flex-start; }
.coach .num{ font-family:var(--font-mono); font-weight:800; color:var(--accent); font-size:13px; flex:0 0 auto; padding-top:2px; }

/* sample waveform */
.wave{ width:100%; height:90px; border-radius:12px; background:var(--lcd-bg); border:1px solid rgba(125,255,155,0.12); display:block; }
.sampler-panel{ max-width:560px; margin:0 auto; }
.sampler-row{ display:flex; gap:10px; flex-wrap:wrap; align-items:center; justify-content:center; margin-top:14px; }

/* ============================================================
   REVIEW / FLASHCARDS
   ============================================================ */
.review-card{ max-width:620px; margin:0 auto; text-align:center; padding:34px 26px; }
.review-card .q{ font-size:21px; font-weight:700; margin:14px 0 22px; }
.review-card .a{ color:var(--muted); font-size:16px; margin-bottom:8px; }
.review-grade{ display:flex; gap:10px; justify-content:center; margin-top:24px; flex-wrap:wrap; }
.progress-line{ display:flex; gap:5px; justify-content:center; margin-bottom:6px; }
.progress-line i{ width:26px; height:5px; border-radius:99px; background:var(--surface-2); }
.progress-line i.on{ background:var(--accent); }

/* ============================================================
   GLOSSARY
   ============================================================ */
.glos-controls{ display:flex; gap:10px; flex-wrap:wrap; margin-bottom:18px; }
.search{ flex:1; min-width:200px; display:flex; align-items:center; gap:10px; padding:10px 15px; border-radius:12px;
  background:var(--surface); border:1px solid var(--border-soft); }
.search input{ flex:1; background:transparent; border:none; outline:none; color:var(--text); font-size:15px; font-family:inherit; }
.glos-grid{ display:grid; grid-template-columns:repeat(auto-fill, minmax(260px,1fr)); gap:12px; }
.term{ padding:16px; }
.term h4{ margin:0 0 4px; font-size:15.5px; display:flex; align-items:center; gap:8px; }
.term .cat{ font-family:var(--font-mono); font-size:9.5px; letter-spacing:1.5px; text-transform:uppercase; color:var(--accent); }
.term p{ margin:6px 0 0; color:var(--muted); font-size:13.5px; }

/* filters */
.filterbar{ display:flex; gap:7px; flex-wrap:wrap; }
.filterbar button{ appearance:none; cursor:pointer; font-family:var(--font-mono); font-size:11px; letter-spacing:.5px;
  padding:6px 11px; border-radius:999px; border:1px solid var(--border-soft); background:var(--surface); color:var(--muted); transition:all .3s var(--ease); }
.filterbar button.on{ background:var(--accent); color:var(--accent-ink); border-color:var(--accent); }

/* toast + modal */
.toast{ position:fixed; left:50%; bottom:26px; transform:translateX(-50%) translateY(20px); opacity:0; pointer-events:none;
  background:var(--panel); border:1px solid var(--border); color:var(--text); padding:12px 20px; border-radius:12px;
  box-shadow:var(--glow); z-index:60; transition:all .4s var(--ease); font-size:14px; font-weight:600; }
.toast.show{ opacity:1; transform:translateX(-50%) translateY(0); }
.sheet-bg{ position:fixed; inset:0; background:rgba(2,4,10,0.62); backdrop-filter:blur(6px); z-index:50; opacity:0; pointer-events:none; transition:opacity .35s var(--ease); }
.sheet-bg.show{ opacity:1; pointer-events:auto; }
.sheet{ position:fixed; z-index:51; left:50%; top:50%; transform:translate(-50%,-46%) scale(.98); opacity:0; pointer-events:none;
  width:min(520px,92vw); max-height:84vh; overflow:auto; background:var(--panel); border:1px solid var(--border-soft);
  border-radius:20px; padding:24px; box-shadow:var(--glow); transition:all .4s var(--ease); }
.sheet.show{ opacity:1; transform:translate(-50%,-50%) scale(1); pointer-events:auto; }

.footer{ text-align:center; color:var(--muted); font-family:var(--font-mono); font-size:11.5px; letter-spacing:.5px; padding:30px 0 10px; }
.footer b{ color:var(--accent); }

.hide{ display:none !important; }
.center{ text-align:center; }
.mono{ font-family:var(--font-mono); }
.muted{ color:var(--muted); }
.spin{ display:inline-block; width:16px; height:16px; border:2px solid var(--border-soft); border-top-color:var(--accent); border-radius:50%; animation:sp .7s linear infinite; }
@keyframes sp{ to{ transform:rotate(360deg); } }
</style>
</head>
<body>
<div id="app"></div>
<div id="toast" class="toast"></div>
<div id="sheetBg" class="sheet-bg"></div>
<div id="sheet" class="sheet"></div>
<script>
"use strict";

/* ============================================================
   DONNÉES — combos vérifiés sur le guide officiel Teenage Engineering
   (teenage.engineering/guides/po-33). Notation TE : minuscules.
   Token combo : "+" = plus ; "*xxx" = touche variable (accent).
   demo[] = {hold:[ids], tap:id|null, knob:'A'|'B'} pour l'animation.
   ============================================================ */

const FX = [
  { n:1,  name:'loop 16',       desc:"Boucle les 16 derniers pas joués — la plus longue.", impl:'loop' },
  { n:2,  name:'loop 12',       desc:"Boucle sur 12 pas : crée un décalage, un côté bancal.", impl:'loop' },
  { n:3,  name:'loop short',    desc:"Boucle courte (≈4 pas) : effet bégaiement rythmique.", impl:'loop' },
  { n:4,  name:'loop shorter',  desc:"Boucle très courte (≈2 pas) : presque une note tenue.", impl:'loop' },
  { n:5,  name:'unison',        desc:"Double le son à l'unisson : ça épaissit, ça gonfle.", impl:'detune' },
  { n:6,  name:'unison low',    desc:"Unisson vers le grave : plus lourd, plus sombre.", impl:'detune' },
  { n:7,  name:'octave up',     desc:"Monte d'une octave : tout devient aigu, façon cassette accélérée.", impl:'octave' },
  { n:8,  name:'octave down',   desc:"Descend d'une octave : ralenti, gras, dramatique.", impl:'octave' },
  { n:9,  name:'stutter 4',     desc:"Re-déclenche le pas en 4 : ta-ta-ta-ta.", impl:'stutter' },
  { n:10, name:'stutter 3',     desc:"Re-déclenche en triolets de 3 : feel ternaire.", impl:'stutter' },
  { n:11, name:'scratch',       desc:"Va-et-vient de lecture : imite un scratch de platine.", impl:'scratch' },
  { n:12, name:'scratch fast',  desc:"Scratch rapide et nerveux.", impl:'scratch' },
  { n:13, name:'6 / 8 quantize',desc:"Recale le groove en 6/8 : balancement ternaire.", impl:'feel' },
  { n:14, name:'retrigger pattern', desc:"Relance le pattern depuis le pas 1 en boucle.", impl:'retrig' },
  { n:15, name:'reverse',       desc:"Lit le motif à l'envers.", impl:'reverse' },
  { n:16, name:'no effect',     desc:"Aucun effet. En write : write + fx + 16 efface les FX enregistrés.", impl:'none' },
];

/* Kit de batterie synthétisé (mode drum). type → moteur audio. */
const KIT = [
  { i:1,  name:'kick',     short:'KICK', type:'kick' },
  { i:2,  name:'snare',    short:'SNR',  type:'snare' },
  { i:3,  name:'hat closed',short:'HHC', type:'hatC' },
  { i:4,  name:'hat open',  short:'HHO', type:'hatO' },
  { i:5,  name:'clap',     short:'CLAP', type:'clap' },
  { i:6,  name:'rim',      short:'RIM',  type:'rim' },
  { i:7,  name:'tom',      short:'TOM',  type:'tom' },
  { i:8,  name:'cowbell',  short:'CWB',  type:'cow' },
  { i:9,  name:'sub bass', short:'BASS', type:'bass' },
  { i:10, name:'blip',     short:'BLIP', type:'blip' },
  { i:11, name:'stab',     short:'STAB', type:'stab' },
  { i:12, name:'noise',    short:'NZ',   type:'noise' },
  { i:13, name:'voice',    short:'VOX',  type:'vox' },
  { i:14, name:'perc',     short:'PRC',  type:'perc' },
  { i:15, name:'shaker',   short:'SHK',  type:'shaker' },
  { i:16, name:'crash',    short:'CRSH', type:'crash' },
];

/* Tints par module (assombris auto en thème Light via mix) */
const MTINTS = ['#f0b429','#34d1c4','#fb7185','#a78bfa','#f472b6','#38bdf8','#4ade80','#fbbf24','#22d3ee'];

const MODULES = [
{ id:1, title:"Prise en main", blurb:"Ce qu'est le KO!, son écran, ses 7 boutons et ses 16 touches.", lessons:[
  { id:'1.1', title:"Le KO! en 30 secondes", goal:"Comprendre ce que fait la machine avant de toucher un bouton.",
    prose:[
      "Le <strong>PO-33 K.O!</strong> est un <strong>micro-sampler</strong> de Teenage Engineering. Traduction : il <strong>enregistre des sons</strong> (au micro ou par câble) puis te laisse les <strong>rejouer et les séquencer</strong> sur une grille de 16 pas.",
      "Deux façons de jouer un son : en <strong>batterie</strong> (chaque touche = une tranche du son) ou en <strong>mélodie</strong> (chaque touche = une note d'une gamme). Le reste de l'app détaille chacune.",
    ],
    why:"Le KO! tient dans la poche, n'a pas de menus profonds : presque tout se fait avec des <em>combos de touches</em>. Apprendre les combos = maîtriser la machine.",
    flash:{ q:"En une phrase, que fait le PO-33 K.O! ?", a:"Il échantillonne des sons (micro/line-in) et les rejoue/séquence sur 16 pas, en mode batterie ou mélodique." } },

  { id:'1.2', title:"L'écran et les deux knobs", goal:"Lire l'écran LCD et savoir à quoi servent les knobs A et B.",
    prose:[
      "L'<strong>écran</strong> affiche en permanence l'essentiel : le <strong>mode</strong>, le <strong>tempo (bpm)</strong> en haut à droite, l'indicateur <strong>write</strong> quand tu édites, et le nombre de <strong>secondes restantes</strong> quand tu enregistres.",
      "Les deux <strong>knobs A et B</strong> règlent toujours <strong>le paramètre affiché à l'instant</strong>. Ils n'ont pas une fonction fixe : leur rôle change selon le contexte (trim, filtre, tempo, swing…).",
    ],
    why:"Sur le KO!, A et B sont des couteaux suisses. Le réflexe à prendre : <em>d'abord regarder l'écran pour savoir ce que A et B contrôlent maintenant</em>.",
    sim:'drum',
    flash:{ q:"Les knobs A et B ont-ils une fonction fixe ?", a:"Non. Ils règlent le paramètre affiché à l'écran sur le moment (trim, filtre, tempo, swing…)." } },

  { id:'1.3', title:"Les 7 boutons de fonction", goal:"Nommer sound, pattern, bpm, write, play, record, fx.",
    prose:[
      "Autour des 16 touches, sept boutons commandent tout : <strong>sound</strong> (choisir un son), <strong>pattern</strong> (choisir un motif), <strong>bpm</strong> (tempo), <strong>write</strong> (mode écriture), <strong>play</strong> (lecture/stop), <strong>record</strong> (échantillonner) et <strong>fx</strong> (effets + bascule des paramètres).",
      "La logique : un bouton de fonction se <strong>maintient</strong>, puis on <strong>presse une touche 1–16</strong>. Par ex. <em>maintenir sound + presser 3</em> = choisir le son 3.",
    ],
    why:"Tous les combos suivent ce schéma « maintenir un bouton + presser une touche ». Une fois le réflexe acquis, le reste s'enchaîne.",
    sim:'drum',
    flash:{ q:"Quel est le schéma de base d'un combo sur le KO! ?", a:"Maintenir un bouton de fonction (sound, pattern, fx…) puis presser une touche 1–16." } },

  { id:'1.4', title:"Les 16 touches ont trois rôles", goal:"Comprendre que 1–16 = sons, patterns ou effets selon le bouton tenu.",
    prose:[
      "Les <strong>16 touches numérotées</strong> changent de sens selon ce que tu tiens : avec <strong>sound</strong> → ce sont les <strong>16 sons</strong> ; avec <strong>pattern</strong> → les <strong>16 patterns</strong> ; avec <strong>fx</strong> → les <strong>16 effets</strong>.",
      "Seules, en lecture, elles <strong>jouent</strong> le son sélectionné. En <strong>write</strong>, elles <strong>posent ou enlèvent</strong> un pas sur la grille.",
    ],
    why:"Un seul clavier, trois cartes mentales superposées. C'est ce qui rend le KO! si compact — et pourquoi connaître « quel bouton je tiens » est vital.",
    sim:'drum',
    flash:{ q:"À quoi servent les touches 1–16 quand on tient « fx » ?", a:"À déclencher les 16 effets (punch-in)." } },

  { id:'1.5', title:"Play / Stop & les 16 pas", goal:"Lancer/arrêter la lecture et visualiser un pattern de 16 pas.",
    prose:[
      "Un <strong>pattern = 16 pas</strong>, joués en boucle de gauche à droite. <strong>play</strong> lance la lecture, <strong>play</strong> à nouveau l'arrête.",
      "Une tête de lecture parcourt les pas. Sur l'écran et sur les touches, tu vois quel pas est en train de sonner.",
    ],
    why:"16 pas, c'est exactement <em>une mesure en 4/4 découpée en doubles-croches</em>. Tout le rythme du KO! tient dans cette grille (voir module 9).",
    sim:'drum',
    combo:{ tokens:['play'], cap:"lance / arrête la lecture", demo:[{hold:[], tap:'play'}] },
    flash:{ q:"Combien de pas compte un pattern, et comment le lancer ?", a:"16 pas. On lance/arrête avec le bouton play." } },

  { id:'1.6', title:"Allumer, horloge & extinction auto", goal:"Démarrer la machine, régler l'heure, voir l'état batterie.",
    prose:[
      "Au démarrage (2 piles AAA), le KO! demande l'<strong>heure</strong> : <strong>knob A</strong> = heures, <strong>knob B</strong> = minutes, puis une touche pour valider.",
      "Sans action, il s'éteint tout seul (<strong>auto power off</strong>) et n'affiche plus que l'heure. Pour l'<strong>état batterie / infos système</strong> : <strong>sound + bpm</strong>.",
    ],
    why:"C'est aussi une horloge avec réveil. Bon à savoir : il s'éteint seul pour économiser les piles, sans perdre tes sons (tant que le lock tab est en place — module 8).",
    combo:{ tokens:['sound','+','bpm'], cap:"affiche l'état batterie / les infos système", demo:[{hold:['sound'], tap:'bpm'}] },
    flash:{ q:"Quel combo affiche l'état de la batterie / les infos système ?", a:"sound + bpm." } },
]},

{ id:2, title:"Le son & le mode drum", blurb:"Choisir un son, le jouer, le sculpter avec TONE / FILTER / TRIM.", lessons:[
  { id:'2.1', title:"Sélectionner un son", goal:"Charger un des 16 sons sous les doigts.",
    prose:[
      "Pour choisir le son actif : <strong>maintenir sound + presser une touche 1–16</strong>. La touche choisie devient le son que tu joues et que tu édites.",
      "Le son sélectionné est celui que <strong>write</strong> va séquencer, et celui que les knobs vont régler.",
    ],
    why:"Tout part du « son courant ». Avant d'écrire un pas ou de tourner un knob, demande-toi toujours : <em>quel son est sélectionné ?</em>",
    sim:'drum',
    combo:{ tokens:['sound','+','*1–16'], cap:"sélectionne le son correspondant", demo:[{hold:['sound'], tap:'k1'}] },
    flash:{ q:"Comment sélectionner le son 5 ?", a:"Maintenir sound puis presser la touche 5." } },

  { id:'2.2', title:"Jouer les sons en live", goal:"Déclencher les sons à la main, sans séquenceur.",
    prose:[
      "En lecture (hors write), presse simplement les <strong>touches 1–16</strong> pour <strong>jouer</strong> le son sélectionné. En mode drum, chaque touche déclenche une <strong>tranche</strong> différente du son.",
      "Si tu n'entends rien, presse <strong>write une fois</strong> pour sortir/entrer du mode écriture : tu étais peut-être en train d'éditer.",
    ],
    why:"Jouer à la main avant de séquencer, c'est le meilleur moyen de <em>sentir</em> un son et de repérer ses tranches intéressantes.",
    sim:'drum',
    flash:{ q:"Tu presses les touches mais aucun son ne sort : quel réflexe ?", a:"Presser write une fois — tu es sans doute resté en mode écriture." } },

  { id:'2.3', title:"16 slots, deux sections", goal:"Distinguer la section drum et la section mélodique.",
    prose:[
      "Les <strong>16 slots de son</strong> sont répartis en <strong>deux sections</strong> : <strong>drum</strong> et <strong>mélodique</strong>. Un même enregistrement se comporte différemment selon la section où il a été rangé.",
      "En <strong>drum</strong>, chaque touche = une <strong>tranche</strong> (slice) du son. En <strong>mélodique</strong>, chaque touche = le <strong>son entier joué à une hauteur</strong> de la gamme.",
    ],
    why:"C'est LE concept du KO! : le même sample devient une boîte à rythmes (drum) ou un instrument jouable (mélodique) selon où tu le ranges.",
    sim:'melodic',
    flash:{ q:"Quelle différence entre un son rangé en drum et en mélodique ?", a:"Drum : chaque touche est une tranche du son. Mélodique : chaque touche joue le son entier à une hauteur de gamme." } },

  { id:'2.4', title:"Sculpter : TONE / FILTER / TRIM", goal:"Basculer entre les 3 paires de paramètres avec fx.",
    prose:[
      "Le KO! a <strong>6 paramètres</strong>, en <strong>3 paires</strong>, tous réglés par A et B. On passe de l'une à l'autre en <strong>pressant fx</strong> :",
      "<strong>TONE</strong> (hauteur + volume) · <strong>FILTER</strong> (passe-haut/passe-bas + résonance) · <strong>TRIM</strong> (début + longueur du son).",
    ],
    why:"Trois paires seulement : facile à mémoriser. fx fait défiler TONE → FILTER → TRIM. Regarde l'écran pour savoir où tu es.",
    sim:'drum',
    combo:{ tokens:['fx'], cap:"fait défiler TONE → FILTER → TRIM", demo:[{hold:[], tap:'fx'}] },
    flash:{ q:"Quelles sont les 3 paires de paramètres, et comment basculer ?", a:"TONE (hauteur+volume), FILTER (passe-haut/bas+résonance), TRIM (début+longueur). On bascule en pressant fx." } },

  { id:'2.5', title:"TRIM : caler le son", goal:"Régler le point de départ et la longueur d'une tranche.",
    prose:[
      "En mode <strong>TRIM</strong> : <strong>knob A = début</strong> du son, <strong>knob B = longueur</strong>. Tu enlèves le silence, tu gardes juste la partie qui claque.",
      "En section drum, chaque tranche se règle <strong>individuellement</strong> : c'est la <strong>dernière tranche déclenchée</strong> qui est ajustée. Joue la tranche, puis tourne A/B.",
    ],
    why:"Un sample bien trimmé = un beat propre. 80% du « son pro » d'un KO! vient d'un trim soigné sur chaque tranche.",
    sim:'sample',
    combo:{ tokens:['fx','→','TRIM','+','A','/','B'], cap:"A = début, B = longueur (sur la dernière tranche jouée)", demo:[{hold:[], tap:'fx'},{hold:[], knob:'A'},{hold:[], knob:'B'}] },
    flash:{ q:"En TRIM, que font A et B, et sur quelle tranche ?", a:"A = début, B = longueur. Ça agit sur la dernière tranche déclenchée." } },
]},

{ id:3, title:"Échantillonner", blurb:"Le cœur du KO! : enregistrer, gérer 40 s de mémoire, copier.", lessons:[
  { id:'3.1', title:"Pourquoi sampler", goal:"Saisir l'intérêt d'enregistrer ses propres sons.",
    prose:[
      "Sampler, c'est <strong>capturer n'importe quel son du monde</strong> — ta voix, une casserole, un vinyle, un synthé — pour en faire un instrument.",
      "Le KO! a <strong>40 secondes</strong> de mémoire au total, réparties sur les 16 slots. Court : on apprend vite à <em>choisir</em> et à <em>trimmer</em>.",
    ],
    why:"La contrainte (40 s) est une force : elle pousse à la créativité et à des samples courts et percussifs, parfaits pour le beatmaking.",
    sim:'sample',
    flash:{ q:"Combien de mémoire d'échantillonnage au total sur le KO! ?", a:"40 secondes, réparties sur les 16 slots." } },

  { id:'3.2', title:"Enregistrer au micro", goal:"Capturer un son dans un slot avec le micro intégré.",
    prose:[
      "<strong>Maintiens record + une touche 1–16</strong> : le micro enregistre <strong>tant que tu tiens</strong>, et le son est rangé dans le slot que tu as pressé.",
      "Pendant l'enregistrement, l'écran affiche les <strong>secondes restantes</strong>. Relâche pour arrêter.",
    ],
    why:"Maintenir = enregistrer : tu contrôles la durée au doigt. Pratique pour ne capturer que le claquement utile et économiser la mémoire.",
    sim:'sample',
    combo:{ tokens:['record','+','*1–16'], cap:"enregistre au micro dans ce slot tant que tu tiens", demo:[{hold:['record'], tap:'k1'}] },
    flash:{ q:"Comment enregistrer un son au micro dans le slot 4 ?", a:"Maintenir record + presser 4 ; ça enregistre tant qu'on tient." } },

  { id:'3.3', title:"Sampler via line-in", goal:"Enregistrer depuis une source branchée.",
    prose:[
      "Branche un câble jack dans l'entrée <strong>line in</strong> : le KO! enregistre alors <strong>automatiquement depuis le line in</strong> au lieu du micro.",
      "Source idéale : téléphone, ordi, platine, autre synthé. Le geste reste le même : <strong>record + touche</strong>.",
    ],
    why:"Le micro capte la pièce (et son bruit). Le line-in donne un son propre, direct, sans réverb parasite — meilleur pour des samples nets.",
    sim:'sample',
    flash:{ q:"Que se passe-t-il si un câble est branché dans line in pendant l'enregistrement ?", a:"Le KO! enregistre depuis le line in au lieu du micro." } },

  { id:'3.4', title:"Gérer les 40 secondes", goal:"Libérer de la place et supprimer un son.",
    prose:[
      "Mémoire pleine ? <strong>Supprime</strong> ou <strong>ré-enregistre par-dessus</strong> un slot existant. Pour effacer le son courant : <strong>maintiens record + presse sound</strong>.",
      "Astuce : des samples courts et bien trimmés laissent de la marge pour en garder plus.",
    ],
    why:"40 s passent vite. Savoir effacer proprement évite la panique « mémoire pleine » en pleine session.",
    sim:'sample',
    combo:{ tokens:['record','+','sound'], cap:"supprime le son actuellement sélectionné", demo:[{hold:['record'], tap:'sound'}] },
    flash:{ q:"Comment supprimer le son sélectionné ?", a:"Maintenir record + presser sound." } },

  { id:'3.5', title:"Copier un son ou une tranche", goal:"Dupliquer un son/slice vers un autre slot.",
    prose:[
      "<strong>Copier un son</strong> vers un autre slot : <strong>maintiens write + sound, puis presse la touche de destination (1–16)</strong>.",
      "<strong>Copier une tranche</strong> précise : <strong>write + sound</strong>, puis une touche <strong>9–16</strong> (la tranche source), puis la touche <strong>1–16</strong> de destination.",
    ],
    why:"Copier évite de re-sampler. Tu construis vite un kit en dupliquant un bon son et en le re-trimmant ailleurs.",
    combo:{ tokens:['write','+','sound','→','*1–16'], cap:"copie le son courant vers le slot de destination", demo:[{hold:['write','sound'], tap:'k1'}] },
    flash:{ q:"Comment copier le son courant vers le slot 8 ?", a:"Maintenir write + sound, puis presser 8." } },

  { id:'3.6', title:"Drum ou mélodique à l'enregistrement", goal:"Choisir la section selon l'usage du sample.",
    prose:[
      "Le slot où tu ranges détermine le comportement : dans la <strong>section drum</strong>, le son sera <strong>tranché</strong> (slices) ; dans la <strong>section mélodique</strong>, il sera <strong>jouable à différentes hauteurs</strong>.",
      "Donc : un beat à découper → section drum. Une note tenue, une voix, une nappe → section mélodique.",
    ],
    why:"Penser « à quoi va servir ce sample ? » avant d'enregistrer t'évite de devoir le recopier ailleurs ensuite.",
    sim:'melodic',
    flash:{ q:"Tu sample une note de basse pour jouer une mélodie : quelle section ?", a:"La section mélodique (le son sera jouable à différentes hauteurs)." } },
]},

{ id:4, title:"Séquencer", blurb:"Le write mode : poser un beat, live record et parameter locks.", lessons:[
  { id:'4.1', title:"Entrer en write mode", goal:"Activer l'écriture et lire l'état des pas.",
    prose:[
      "<strong>Presse write</strong> pour entrer/sortir du mode écriture. L'indicateur <strong>write</strong> s'allume à l'écran.",
      "En write, presse <strong>1–16</strong> pour <strong>poser</strong> un pas (la touche s'allume). Presse un pas <strong>déjà allumé</strong> pour l'<strong>enlever</strong>. <strong>play</strong> écoute le résultat.",
    ],
    why:"Write = le mode « je dessine le rythme pas à pas ». C'est l'opposé du live : ici tout est calé sur la grille, sans erreur de timing.",
    sim:'drum',
    combo:{ tokens:['write'], cap:"entre / sort du mode écriture", demo:[{hold:[], tap:'write'}] },
    flash:{ q:"En write mode, comment enlève-t-on un pas déjà posé ?", a:"En pressant à nouveau ce pas (touche allumée → éteinte)." } },

  { id:'4.2', title:"Poser ton premier beat", goal:"Écrire un kick/snare/hat sur la grille.",
    prose:[
      "La recette : <strong>1)</strong> sélectionne un son (sound + touche). <strong>2)</strong> entre en write. <strong>3)</strong> presse les pas où ce son doit sonner. <strong>4)</strong> change de son et recommence.",
      "Chaque son a sa <strong>propre rangée de 16 pas</strong> ; le pattern superpose toutes les rangées.",
    ],
    why:"Un son après l'autre, tu empiles les couches. C'est exactement comme dessiner une partition de batterie ligne par ligne.",
    sim:'drum',
    flash:{ q:"Dans l'ordre, quelles sont les 4 étapes pour poser un beat ?", a:"1) sélectionner un son, 2) write on, 3) poser les pas, 4) changer de son et recommencer." } },

  { id:'4.3', title:"Effacer & nettoyer", goal:"Corriger un pattern sans tout refaire.",
    prose:[
      "En write, presser un <strong>pas allumé</strong> l'efface. Pour repartir d'un son propre, enlève ses pas un à un.",
      "Pour effacer un <strong>pattern entier</strong>, vois le module 7 : <strong>record + pattern</strong>.",
    ],
    why:"Savoir défaire vite = oser essayer. Pas besoin d'être parfait du premier coup.",
    sim:'drum',
    flash:{ q:"Comment effacer un seul pas d'un son ?", a:"En write mode, presser ce pas allumé pour l'éteindre." } },

  { id:'4.4', title:"Live record (jouer en temps réel)", goal:"Enregistrer en jouant, pendant la lecture.",
    prose:[
      "Pendant que ça <strong>joue</strong> : <strong>maintiens write + presse les touches 1–16</strong> pour <strong>punch-in</strong> tes notes en direct. Elles sont <strong>quantizées</strong> selon le swing réglé.",
      "Relâche write quand tu as fini. C'est le mode « je joue le groove au feeling ».",
    ],
    why:"Le live record donne un feel plus humain que le pas-à-pas, tout en restant calé grâce à la quantize. Le meilleur des deux mondes.",
    sim:'drum',
    combo:{ tokens:['(play)','write','+','*1–16'], cap:"en lecture : punch-in des notes en temps réel", demo:[{hold:['write'], tap:'k1'}] },
    flash:{ q:"Comment enregistrer des notes en temps réel pendant la lecture ?", a:"Pendant que ça joue, maintenir write + presser les touches ; les notes sont quantizées au swing." } },

  { id:'4.5', title:"Parameter lock (P-lock)", goal:"Figer un réglage de knob sur le pattern.",
    prose:[
      "Pendant la lecture, <strong>maintiens write + tourne A ou B</strong> : tu <strong>verrouilles</strong> le paramètre courant dans le pattern, pour le son sélectionné.",
      "Verrouillables : <strong>tone</strong> et <strong>filter</strong>. Pour annuler un enregistrement de p-lock : <strong>record + tourne le knob</strong>.",
    ],
    why:"Les p-locks font « bouger » un son dans le temps (filtre qui s'ouvre, pitch qui monte) sans automation compliquée. C'est ce qui rend un pattern vivant.",
    sim:'drum',
    combo:{ tokens:['(play)','write','+','A','/','B'], cap:"verrouille tone/filter dans le pattern", demo:[{hold:['write'], knob:'A'}] },
    flash:{ q:"Quels paramètres peut-on verrouiller (p-lock), et comment ?", a:"tone et filter — en lecture, maintenir write + tourner A/B." } },

  { id:'4.6', title:"Tempo, swing & volume", goal:"Régler bpm, le swing et le volume général.",
    prose:[
      "<strong>Presse bpm</strong> pour changer de tempo préréglé : <strong>HIP HOP 80</strong>, <strong>DISCO 120</strong>, <strong>TENCHO 140</strong>. Pour un réglage fin (60–240) : <strong>maintiens bpm + tourne B</strong>.",
      "<strong>Swing</strong> : <strong>maintiens bpm + tourne A</strong>. <strong>Volume général</strong> : <strong>maintiens bpm + presse 1–16</strong> (1 = bas, 16 = fort).",
    ],
    why:"Le swing décale les contretemps : c'est l'âme du groove hip-hop. Même un beat simple « respire » dès qu'on ajoute un peu de swing.",
    sim:'drum',
    combo:{ tokens:['bpm','+','A'], cap:"règle le swing (le balancement du groove)", demo:[{hold:['bpm'], knob:'A'}] },
    flash:{ q:"Comment règle-t-on le swing ?", a:"Maintenir bpm + tourner le knob A." } },
]},

{ id:5, title:"Mode mélodique", blurb:"Transformer un sample en instrument jouable sur une gamme.", lessons:[
  { id:'5.1', title:"Le clavier mélodique", goal:"Comprendre les touches comme une gamme.",
    prose:[
      "Dans la <strong>section mélodique</strong>, les <strong>16 touches forment une gamme</strong> : chaque touche rejoue le <strong>son entier</strong> à une <strong>hauteur</strong> différente, du grave vers l'aigu.",
      "Tu joues une mélodie comme sur un petit clavier, avec ton propre sample comme « instrument ».",
    ],
    why:"C'est ce qui sépare un sampler d'une boîte à rythmes : ta voix ou un accord devient un synthé mélodique en deux gestes.",
    sim:'melodic',
    flash:{ q:"En mode mélodique, que fait chaque touche ?", a:"Elle rejoue le son entier à une hauteur de la gamme (clavier)." } },

  { id:'5.2', title:"Jouer une mélodie", goal:"Improviser sur le clavier mélodique.",
    prose:[
      "Sélectionne un son mélodique (sound + touche de la section mélodique), puis <strong>joue les touches 1–16</strong> : chacune sonne plus haut que la précédente.",
      "Commence par monter/descendre la gamme lentement pour repérer les notes qui sonnent bien ensemble.",
    ],
    why:"Jouer d'oreille avant d'écrire : tu mémorises où sont les notes agréables, ce qui rend l'écriture mélodique bien plus rapide.",
    sim:'melodic',
    flash:{ q:"Comment improvise-t-on une mélodie sur le KO! ?", a:"Choisir un son mélodique puis jouer les touches 1–16 (chaque touche = une hauteur)." } },

  { id:'5.3', title:"Écrire une mélodie", goal:"Séquencer des notes mélodiques sur 16 pas.",
    prose:[
      "Comme pour la batterie : entre en <strong>write</strong> et pose des notes, ou utilise le <strong>live record</strong> (write + touches en lecture) pour jouer la ligne au feeling.",
      "Une note par pas : le KO! mélodique est <strong>monophonique</strong> par séquence. Pense « ligne » (basse, lead) plutôt qu'« accord ».",
    ],
    why:"Penser en lignes monophoniques simplifie la composition et colle au format du KO! — une basse + un lead suffisent à un morceau entier.",
    sim:'melodic',
    flash:{ q:"Le séquenceur mélodique du KO! joue-t-il des accords ?", a:"Non, il est pensé monophonique : une note par pas (lignes de basse/lead)." } },

  { id:'5.4', title:"Construire une ligne de basse", goal:"Poser une basse qui soutient le beat.",
    prose:[
      "Choisis un son grave (type sub/bass) en section mélodique. Pose la <strong>fondamentale sur le pas 1</strong>, puis quelques notes de la gamme aux pas forts (1, 5, 9, 13).",
      "Garde-la <strong>simple</strong> : une bonne basse soutient, elle ne se fait pas remarquer.",
    ],
    why:"La basse relie le rythme (kick) et l'harmonie. Caler la fondamentale sur le kick (pas 1) ancre tout le morceau.",
    sim:'melodic',
    flash:{ q:"Sur quels pas poser les notes d'une basse simple en 16 pas ?", a:"Sur les pas forts : 1, 5, 9, 13 (la fondamentale sur le 1, calée avec le kick)." } },
]},

{ id:6, title:"Les effets (punch-in)", blurb:"Les 16 effets momentanés : loops, stutters, scratch, reverse…", lessons:[
  { id:'6.1', title:"Le bouton fx", goal:"Déclencher un effet en temps réel.",
    prose:[
      "Pendant la lecture, <strong>maintiens fx + presse une touche 1–15</strong> : l'effet agit <strong>tant que tu tiens</strong> (momentané), puis tout revient à la normale.",
      "Si <strong>write est actif</strong>, l'effet est <strong>enregistré</strong> dans le pattern. Pour effacer les effets enregistrés : <strong>write actif + fx + 16</strong>.",
    ],
    why:"Les punch-in FX, c'est la performance live du KO! : tu « joues » les effets à la main pour créer des breaks et des montées.",
    sim:'drum',
    combo:{ tokens:['(play)','fx','+','*1–15'], cap:"déclenche l'effet tant que tu tiens", demo:[{hold:['fx'], tap:'k9'}] },
    flash:{ q:"Les punch-in FX sont-ils permanents ?", a:"Non, momentanés (tant qu'on tient fx + touche). Sauf si write est actif : ils sont alors enregistrés dans le pattern." } },

  { id:'6.2', title:"La carte des 16 effets", goal:"Mémoriser ce que fait chaque touche d'effet.",
    prose:[
      "Les effets sont rangés par familles sur les touches 1–16. Survole-les ci-dessous (ou dans le simulateur) pour entendre/voir l'idée.",
      "Repère mental : <strong>1–4 loops</strong>, <strong>5–8 hauteur</strong> (unison/octave), <strong>9–12 stutter/scratch</strong>, <strong>13–15 feel/reverse</strong>, <strong>16 = rien</strong>.",
    ],
    why:"Connaître la carte = atteindre le bon effet sans réfléchir en plein live. Les familles aident à mémoriser par blocs de 4.",
    sim:'fx',
    flash:{ q:"Que fait l'effet 16 ?", a:"Aucun effet (no effect). En write, write + fx + 16 efface les FX enregistrés." } },

  { id:'6.3', title:"Loops & stutters", goal:"Créer des breaks rythmiques avec 1–4 et 9–10.",
    prose:[
      "<strong>loop 16 / 12 / short / shorter</strong> (touches 1–4) bouclent une portion de plus en plus courte du motif : de la boucle entière au bégaiement serré.",
      "<strong>stutter 4 / 3</strong> (9–10) re-déclenchent le pas en cours, en binaire (4) ou en triolets (3).",
    ],
    why:"Loops et stutters fabriquent les fameux « rolls » et montées de fin de phrase. Un coup de loop shorter avant le temps 1 = tension instantanée.",
    sim:'fx',
    flash:{ q:"Quelle différence entre stutter 4 et stutter 3 ?", a:"stutter 4 re-déclenche en binaire (4 coups), stutter 3 en triolets (feel ternaire)." } },

  { id:'6.4', title:"Scratch, octave, reverse…", goal:"Maîtriser 5–8 et 11–15.",
    prose:[
      "<strong>unison / unison low</strong> (5–6) épaississent ; <strong>octave up / down</strong> (7–8) transposent d'une octave. <strong>scratch / scratch fast</strong> (11–12) imitent la platine.",
      "<strong>6/8 quantize</strong> (13) bascule en feel ternaire ; <strong>retrigger pattern</strong> (14) relance depuis le pas 1 ; <strong>reverse</strong> (15) joue à l'envers.",
    ],
    why:"Ces effets changent la couleur ou la direction du son. octave down + reverse sur un break = transition cinématique en une seconde.",
    sim:'fx',
    flash:{ q:"Que fait l'effet retrigger pattern (14) ?", a:"Il relance le pattern depuis le pas 1, en boucle, tant qu'on le tient." } },

  { id:'6.5', title:"Jouer les FX musicalement", goal:"Utiliser les effets au bon moment.",
    prose:[
      "Règle d'or : un effet se place <strong>en fin de phrase</strong> (pas 13–16) pour annoncer la suite, ou sur <strong>un temps fort</strong> pour surprendre.",
      "Moins, c'est plus : un effet bien placé marque ; dix effets enchaînés noient le morceau.",
    ],
    why:"Les FX ponctuent le récit du morceau (intro → couplet → break → drop). Les semer avec parcimonie garde l'impact.",
    sim:'drum',
    flash:{ q:"Où placer typiquement un effet pour annoncer la suite ?", a:"En fin de phrase, sur les pas 13–16 (montée/transition)." } },
]},

{ id:7, title:"Patterns & morceau", blurb:"Plusieurs motifs, les copier, les chaîner en chanson.", lessons:[
  { id:'7.1', title:"Sélectionner un pattern", goal:"Naviguer entre les 16 patterns.",
    prose:[
      "<strong>Maintiens pattern + presse 1–16</strong> pour choisir le pattern actif. La <strong>led qui clignote</strong> indique le pattern en cours.",
      "Chaque pattern est une grille de 16 pas indépendante : tu construis plusieurs motifs (couplet, refrain…) et tu navigues entre eux.",
    ],
    why:"Un seul pattern = une boucle qui lasse. Plusieurs patterns = de la variation, donc un vrai morceau.",
    sim:'drum',
    combo:{ tokens:['pattern','+','*1–16'], cap:"sélectionne le pattern correspondant", demo:[{hold:['pattern'], tap:'k1'}] },
    flash:{ q:"Comment savoir quel pattern est actif ?", a:"La led qui clignote indique le pattern en cours." } },

  { id:'7.2', title:"Copier & effacer un pattern", goal:"Dupliquer un motif, repartir de zéro.",
    prose:[
      "<strong>Copier</strong> le pattern actif vers un autre slot : <strong>maintiens write + pattern, puis presse la touche 1–16</strong> de destination.",
      "<strong>Effacer</strong> le pattern actif : <strong>record + pattern</strong>.",
    ],
    why:"Copier puis modifier légèrement (un fill, un son en plus) crée des variations cohérentes — l'astuce n°1 pour étoffer un morceau vite.",
    sim:'drum',
    combo:{ tokens:['write','+','pattern','→','*1–16'], cap:"copie le pattern actif vers la destination", demo:[{hold:['write','pattern'], tap:'k2'}] },
    flash:{ q:"Comment effacer le pattern actif ?", a:"record + pattern." } },

  { id:'7.3', title:"Chaîner les patterns (le morceau)", goal:"Enchaîner des motifs en une séquence.",
    prose:[
      "<strong>Maintiens pattern</strong> et <strong>presse les touches dans l'ordre voulu</strong> : tu construis une <strong>chaîne</strong> (jusqu'à 128 patterns). Un même pattern peut revenir plusieurs fois.",
      "Exemple : <strong>1, 1, 1, 4</strong> joue trois fois le pattern 1 puis le 4, et la chaîne boucle.",
    ],
    why:"Le chaînage est le « mode morceau » du KO! : c'est là que des boucles deviennent une structure intro/couplet/refrain.",
    sim:'drum',
    combo:{ tokens:['pattern','+','1','1','1','4'], cap:"chaîne : 3× pattern 1 puis pattern 4", demo:[{hold:['pattern'], tap:'k1'},{hold:['pattern'], tap:'k1'},{hold:['pattern'], tap:'k4'}] },
    flash:{ q:"Que joue la chaîne 1,1,1,4 ?", a:"Trois fois le pattern 1, puis le pattern 4, puis ça boucle." } },

  { id:'7.4', title:"Structurer un morceau", goal:"Penser intro / couplet / refrain / break.",
    prose:[
      "Répartis tes idées : <strong>P1 intro</strong> (épuré), <strong>P2 couplet</strong>, <strong>P3 refrain</strong> (plus dense), <strong>P4 break</strong> (batterie seule ou FX).",
      "Une chaîne type : <strong>1 · 2 · 3 · 2 · 3 · 4</strong>. Varie la densité pour créer du relief.",
    ],
    why:"L'oreille adore la tension/détente : alterner épuré et dense maintient l'intérêt sans ajouter de nouveaux sons.",
    sim:'drum',
    flash:{ q:"Comment créer du relief dans un morceau sans ajouter de sons ?", a:"En alternant la densité des patterns (épuré ↔ dense) au fil de la chaîne." } },
]},

{ id:8, title:"Sync, sauvegarde & live", blurb:"Volume casque, backup, synchroniser plusieurs PO, reset.", lessons:[
  { id:'8.1', title:"Le volume (attention au casque)", goal:"Régler le volume général en sécurité.",
    prose:[
      "<strong>Maintiens bpm + presse 1–16</strong> pour le volume général (1 = bas, 16 = fort).",
      "Au <strong>casque</strong>, le guide officiel prévient : <strong>ne dépasse 5 qu'avec prudence</strong>. Tes oreilles d'abord.",
    ],
    why:"Le KO! peut sortir fort. Protéger son audition, c'est protéger l'outil n°1 d'un beatmaker (et d'un horloger) : l'oreille.",
    sim:'drum',
    combo:{ tokens:['bpm','+','*1–16'], cap:"règle le volume général (5 max au casque !)", demo:[{hold:['bpm'], tap:'k5'}] },
    flash:{ q:"Quelle précaution de volume au casque ?", a:"Ne dépasser le niveau 5 qu'avec prudence (bpm + touche)." } },

  { id:'8.2', title:"Sauvegarder tes données", goal:"Backup des sons & patterns vers un enregistreur.",
    prose:[
      "Le KO! peut envoyer toutes ses données en audio vers un enregistreur (câble line out → line in). <strong>Transmettre : write + sound + play</strong>.",
      "<strong>Recevoir / restaurer : write + sound + record</strong> (met l'unité en attente). ⚠ À la réception, <strong>tout est écrasé</strong> sur l'unité réceptrice.",
    ],
    why:"Pas de carte mémoire : la sauvegarde passe par l'audio. Indispensable avant un reset ou pour archiver un kit que tu aimes.",
    combo:{ tokens:['write','+','sound','+','play'], cap:"transmet (sauvegarde) les données", demo:[{hold:['write','sound'], tap:'play'}] },
    flash:{ q:"Quel combo transmet (sauvegarde) les données du KO! ?", a:"write + sound + play (réception/restauration : write + sound + record)." } },

  { id:'8.3', title:"Synchroniser plusieurs PO", goal:"Caler le KO! avec d'autres Pocket Operators.",
    prose:[
      "Relie deux unités par un câble stéréo. Sur le <strong>master</strong> : <strong>maintiens record + presse bpm</strong> pour faire défiler les <strong>modes de sync SY0–SY5</strong>.",
      "En sync, le signal se partage : <strong>audio à droite, sync à gauche</strong>. play sur l'esclave (attend), puis play sur le master (démarre).",
    ],
    why:"La sync laisse jouer plusieurs PO ensemble, parfaitement calés. C'est tout l'écosystème Pocket Operator qui s'ouvre.",
    combo:{ tokens:['record','+','bpm'], cap:"fait défiler les modes de sync SY0–SY5 (sur le master)", demo:[{hold:['record'], tap:'bpm'}] },
    flash:{ q:"Comment changer le mode de sync sur l'unité master ?", a:"Maintenir record + presser bpm (défile SY0→SY5)." } },

  { id:'8.4', title:"Reset & lock tab", goal:"Réinitialiser, et protéger ses patterns.",
    prose:[
      "<strong>Reset usine</strong> : <strong>maintiens pattern + write en insérant les piles</strong>. Tout revient au défaut.",
      "Le <strong>lock tab</strong> (languette) : cassé, il <strong>gèle tous les patterns</strong> (protection). ⚠ Une fois retiré, l'<strong>échantillonnage n'est plus possible</strong>.",
    ],
    why:"Le reset dépanne quand la machine bug. Le lock tab est un choix : figer une création… au prix de ne plus pouvoir sampler.",
    combo:{ tokens:['pattern','+','write'], cap:"+ insérer les piles = reset usine", demo:[{hold:['pattern'], tap:'write'}] },
    flash:{ q:"Comment faire un reset usine ?", a:"Maintenir pattern + write tout en insérant les piles." } },

  { id:'8.5', title:"Astuces de performance", goal:"Quelques réflexes pour jouer en live.",
    prose:[
      "Prépare <strong>2–4 patterns</strong> contrastés à l'avance, garde une main sur <strong>fx</strong> pour les transitions, et une chaîne mentale claire.",
      "Un <strong>break</strong> (FX + pattern épuré) avant un retour plein relance l'énergie à coup sûr.",
    ],
    why:"Le live se gagne en préparation : moins tu improvises la structure, plus tu es libre d'improviser les effets et le groove.",
    sim:'drum',
    flash:{ q:"Quel ingrédient simple relance l'énergie d'un live ?", a:"Un break (pattern épuré + FX) juste avant un retour en plein." } },
]},

{ id:9, title:"Solfège du beatmaker", blurb:"Le minimum de théorie pour que tes 16 pas sonnent juste.", lessons:[
  { id:'9.1', title:"BPM, mesure & 16 pas", goal:"Relier la grille du KO! au solfège.",
    prose:[
      "Les <strong>16 pas = 1 mesure de 4/4</strong> en <strong>doubles-croches</strong>. Les <strong>temps</strong> tombent sur les pas <strong>1, 5, 9, 13</strong> ; les <strong>croches</strong> sur 1,3,5,7…",
      "Le <strong>bpm</strong> (battements par minute) fixe la vitesse : 80 (hip-hop), 120 (disco/house), 140 (trap/tencho).",
    ],
    why:"Comprendre que la grille EST une mesure de solfège te permet de placer kick, snare et hats au bon endroit sans tâtonner.",
    sim:'drum',
    flash:{ q:"À quoi correspondent les 16 pas en solfège ?", a:"À une mesure de 4/4 en doubles-croches ; les temps tombent sur 1, 5, 9, 13." } },

  { id:'9.2', title:"Lire une grille rythmique", goal:"Savoir où vont kick, snare et hats.",
    prose:[
      "Recette de base : <strong>kick</strong> sur 1 et 9 (les temps forts), <strong>snare</strong> sur 5 et 13 (les contretemps 2 et 4), <strong>hats</strong> sur tous les pas impairs (ou tous, pour serrer).",
      "C'est le squelette « four-on-the-floor » revisité : à toi de l'habiller ensuite.",
    ],
    why:"Ce placement kick/snare est universel en musiques actuelles. Le connaître, c'est avoir un beat « qui marche » en 30 secondes.",
    sim:'drum',
    flash:{ q:"Placement classique du snare sur 16 pas ?", a:"Sur les pas 5 et 13 (les temps 2 et 4)." } },

  { id:'9.3', title:"3 grooves à reproduire", goal:"Mettre les mains à la pâte sur le simulateur.",
    prose:[

const $  = (s, r=document)=> r.querySelector(s);
const $$ = (s, r=document)=> Array.from(r.querySelectorAll(s));
const clamp = (v,a,b)=> Math.max(a, Math.min(b, v));
function todayStr(d=new Date()){
  const y=d.getFullYear(), m=String(d.getMonth()+1).padStart(2,'0'), da=String(d.getDate()).padStart(2,'0');
  return `${y}-${m}-${da}`;
}
function addDays(dateStr, n){
  const [y,m,d] = String(dateStr).split('-').map(x=>parseInt(x,10));
  const dt = new Date(y,(m||1)-1,d||1); dt.setDate(dt.getDate()+n); return todayStr(dt);
}
const ALL_LESSONS = MODULES.flatMap(m=> m.lessons.map(l=> ({...l, mid:m.id, mtitle:m.title})));
const lessonById = id => ALL_LESSONS.find(l=> l.id===id);

/* ---------- storage ---------- */
const LS = {
  get(k, fb){ try{ const r=localStorage.getItem(k); return r? JSON.parse(r): fb; }catch{ return fb; } },
  set(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch{} }
};
const PKEY='kolab:progress', SKEY='kolab:srs', CKEY='kolab:settings';

const Progress = {

  seeLesson(id){ if(!this.data.seen[id]){ this.data.seen[id]=todayStr(); this.save(); } },
  isSeen(id){ return !!this.data.seen[id]; },
  seenCount(){ return Object.keys(this.data.seen).length; },
